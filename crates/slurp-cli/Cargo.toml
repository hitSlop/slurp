[package]
name = "slurp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
[lints]
workspace = true

[lib]
name = "slurp_app"
[[bin]]
name = "slurp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
slurp-client = { path = "../slurp-client" }
slurp-document = { path = "../slurp-document" }
slurp-render = { path = "../slurp-render" }
clap = { version = "4", features = ["derive", "env"] }
strsim = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4", "v7"] }
tempfile = "3"
include_dir = "0.7"
serde_norway = "0.9.42"
pulldown-cmark = "0.13"
base64 = "0.22"
toml = "0.8"
toml_edit = "0.22"
ctrlc = "3"
thiserror.workspace = true

cliclack = "0.5"
console = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
flate2 = "1"
