name: Block AI Attribution

on:
  pull_request_target:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    # The script publishes the Attribution status on the PR head SHA.
    name: Inspect attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always execute the default branch's policy, never a PR's replacement script.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Inspect incoming commit objects and PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/attribution.mjs
