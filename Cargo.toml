[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/takumi-core"]
[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/hitSlop/slurp"
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
specta = { version = "=2.0.0-rc.27", features = ["derive"] }
# A small set that catches real leftovers; the full pedantic set is too noisy to be useful.
[workspace.lints.clippy]
unused_async = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
debug = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Keep the tested SVG DPR correction until it is available in an upstream release.
[patch.crates-io]
takumi-core = { path = "vendor/takumi-core" }
