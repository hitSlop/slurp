[package]
name = "slurp-client"
description = "Standalone client for the Slurp event service, independent of local analysis"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]

tempfile = "3"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }

anyhow.workspace = true
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
futures = "0.3"
async-trait = "0.1"
zstd = "0.13"
flate2 = "1"

uuid = { version = "1", features = ["v7"] }
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "crypto-rust"] }
libc = "0.2"
toml = "0.8"
tokio = { version = "1", features = ["rt", "time", "fs", "io-util", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
