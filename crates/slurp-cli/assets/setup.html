Agent</span></a><a href="#reports"><!><span>04 · Report</span></a><a href="#hosting"><!><span>05 · Hosting</span></a></nav></details><p class="rail-note">Your data. Your machine.<br/>This private page is an offline snapshot. Rerun <code>slurp init</code> to refresh it.</p></aside><main id="main" class="content"><section class="hero-split svelte-1n46o8q"><div><p class="eyebrow">Project quickstart · Offline snapshot</p><h1 class="svelte-1n46o8q"> </h1><p class="lede svelte-1n46o8q">Connect your app, sync your events, and start asking questions.</p><a class="primary" href="#connect">Connect your app ↗</a></div></section><div class="binding svelte-1n46o8q"><strong class="svelte-1n46o8q"> </strong><code class="svelte-1n46o8q"> </code><span class="svelte-1n46o8q"> </span></div> <section class="section" id="connect"><div class="heading svelte-1n46o8q"><b class="svelte-1n46o8q">01</b><div><h2>Connect your app.</h2><p class="svelte-1n46o8q">Your publishable key sends events. It cannot read them.</p></div></div><!></section> <section class="section" id="sync"><div class="heading svelte-1n46o8q"><b class="svelte-1n46o8q">02</b><div><h2>Sync your events.</h2><p class="svelte-1n46o8q">One source, one DuckDB file. Slurp handles offsets and duplicates.</p></div></div><!><div class="codebox"><div class="codebar"><span>Terminal</span><button> </button></div><pre><code> </code></pre></div><div class="flow svelte-1n46o8q">Your app <span class="svelte-1n46o8q">→</span> Slurp archive <span class="svelte-1n46o8q">→</span> Local DuckDB <span class="svelte-1n46o8q">→</span> Your agent</div><p class="note svelte-1n46o8q"><strong>New events appear in sync after your Worker next seals an archive, about every 10 minutes.</strong><br/>Send and sync show an approximate next-batch time when the server can provide it. Publishing can take longer during retries. Sync downloads published archives; this offline page does not show live status.</p><!></section> <section class="section" id="agents"><div class="heading svelte-1n46o8q"><b class="svelte-1n46o8q">03</b><div><h2>Invite your agent.</h2><p class="svelte-1n46o8q">Codex, Claude, Grok, Muse. Same CLI. Same instructions. Their own read key.</p></div></div><h3>Give a bot access to this source</h3><p>Create a named read-only key, then put it in the bot’s secret store as <code>SLURP_TOKEN</code>. It grants archive reads, not ingestion or source administration.</p><div class="codebox"><div class="codebar"><span>Create a bot key</span><button> </button></div><pre><code> </code></pre></div><!><div class="codebox agent"><div class="codebar"><span>On the agent’s machine</span><button> </button></div><pre><code> </code></pre></div><p class="small svelte-1n46o8q">Keys stay out of URLs and skill files. Revoke access with <code>slurp source key revoke</code>. Rerun <code>slurp init</code> to refresh this snapshot.</p></section> <section class="section" id="reports"><div class="heading svelte-1n46o8q"><b class="svelte-1n46o8q">04</b><div><h2>Make a report.</h2><p class="svelte-1n46o8q">Your agent writes SQL and Markdown. Slurp turns them into a report.</p></div></div><blockquote class="svelte-1n46o8q">“Which events changed this week? Save the SQL and make me a report.”</blockquote><div class="install svelte-1n46o8q"><code class="svelte-1n46o8q">slurp report build report.md --out ./report --png --pdf</code><button class="svelte-1n46o8q"> </button></div><p class="small svelte-1n46o8q">HTML opens in your browser. PNG and PDF are ready to share. Review the data before sharing.</p></section><section class="section" id="hosting"><div class="heading svelte-1n46o8q"><b class="svelte-1n46o8q">05</b><div><h2>Know where it runs.</h2><p class="svelte-1n46o8q">This page stays private and offline. Your events live in your own Cloudflare account.</p></div></div><p>Events are accepted by your Worker, buffered in a Durable Object, then sealed into compressed archives in your R2 bucket. Usage and cost appear on your Cloudflare bill, not here. Archives stay in R2 until you delete them or set a lifecycle rule.</p><div class="codebox"><div class="codebar"><span>Check your deployment</span></div><pre><code> </code></pre></div><p class="small svelte-1n46o8q">Publishable keys can only send events. Keep your admin token and secret keys out of browser code.</p></section><footer><img alt="Slurp"/><span>Collect. Sync. Ask something interesting.</span></footer></main></div><div class="toast svelte-1n46o8q" role="status" aria-live="polite"> </div>',1);function ga(e,t){Pt(t,!0);let r=F(void 0);Fi(()=>{const b=y(r)?.querySelector("details");return b&&matchMedia("(max-width:900px)").matches&&(b.open=!1),y(r)?na(y(r)):void 0});const n=(()=>{try{return JSON.parse(document.getElementById("slurp-context")?.textContent||"{}")}catch{return{}}})();let s=F(!1),i=F(!1),o=F("");const a=n.backend||"https://YOUR_WORKER.workers.dev",l=n.source||"src_YOUR_SOURCE",c=n.sync_commands||null,v=(b,m=!1)=>b.replaceAll("YOUR_INGEST_URL",n.ingest_url||a+"/v1/events").replaceAll("YOUR_SOURCE_ID",l).replaceAll("YOUR_BACKEND",a).replaceAll("YOUR_PUBLISHABLE_KEY",m?n.publishable_key||"YOUR_PUBLISHABLE_KEY":n.publishable_key?"slurp_pk_••••••••":"YOUR_PUBLISHABLE_KEY");async function u(b,m){try{await navigator.clipboard.writeText(b),Z(o,m,!0),setTimeout(()=>Z(o,""),2e3)}catch{Z(o,"Select and copy the code directly.")}}var d=Ri(),h=dt(d);{var f=b=>{var m=ca(),O=g(m),R=w(O),M=p(O);jr(M,{standalone:!0}),le(()=>Ye(R,"src",Lt)),$(b,m)},P=b=>{var m=pa(),O=p(dt(m),2),R=g(O),M=g(R),_=w(M),U=p(M),ie=p(g(U)),j=g(ie),I=g(j);_e(I,{name:"connections"});var Be=p(j),Ue=g(Be);_e(Ue,{name:"sync"});var Xe=p(Be),Dt=g(Xe);_e(Dt,{name:"agent"});var vt=p(Xe),xn=g(vt);_e(xn,{name:"report"});var En=p(vt),kn=g(En);_e(kn,{name:"report"}),Xi(R,B=>Z(r,B),()=>y(r));var Pn=p(R),tr=g(Pn),On=g(tr),Hn=p(g(On)),Dn=w(Hn,!0),rr=p(tr),nr=g(rr),Rn=w(nr,!0),sr=p(nr),Gn=w(sr,!0),Sn=p(sr),Mn=w(Sn,!0),ir=p(rr,2),Bn=p(g(ir));{var jn=B=>{var N=fa(),X=dt(N),ae=p(g(X)),oe=w(ae,!0),je=p(X,
