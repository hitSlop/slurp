name: check
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless; the Rust matrix is slow.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    timeout-minutes: 45
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install test DuckDB
        run: |
          # The same digests `slurp setup` pins (crates/slurp-cli/src/setup.rs).
          if [ "$RUNNER_OS" = macOS ]; then
            asset=osx-universal; sha=8a8f67e7c7f7d1392fa63ba3971948391392fe2a25fca63e7008e33c50beb4c2
          else
            asset=linux-amd64; sha=c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc
          fi
          curl -fL "https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-$asset.tar.gz" -o "$RUNNER_TEMP/duckdb.tar.gz"
          echo "$sha  $RUNNER_TEMP/duckdb.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/duckdb-bin"
          tar -xzf "$RUNNER_TEMP/duckdb.tar.gz" -C "$RUNNER_TEMP/duckdb-bin"
          echo "SLURP_TEST_DUCKDB=$RUNNER_TEMP/duckdb-bin/duckdb" >> "$GITHUB_ENV"
          echo "SLURP_DUCKDB=$RUNNER_TEMP/duckdb-bin/duckdb" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Covers every crate, including the check that backend/src/api.gen.ts is the current export of crates/slurp-client/src/api.rs.
      # CI is set here, so a native test that cannot find DuckDB fails instead of skipping.
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test DuckDB
        run: |
          curl -fL "https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz" -o "$RUNNER_TEMP/duckdb.tar.gz"
          echo "c6507206baf7793c6013dbd82368469a45f20dc0e17a6f92f204602f652ed2bc  $RUNNER_TEMP/duckdb.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/duckdb-bin"
          tar -xzf "$RUNNER_TEMP/duckdb.tar.gz" -C "$RUNNER_TEMP/duckdb-bin"
          echo "SLURP_DUCKDB=$RUNNER_TEMP/duckdb-bin/duckdb" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: backend
      - name: Shared tools have one pinned version across the repo
        run: node scripts/ci/pins.mjs
      - name: The Worker embedded in the CLI is current
        run: node scripts/bundle.mjs --check
        working-directory: backend
      - run: cargo build -p slurp-cli
      - name: The Linux binary needs no D-Bus library (release binaries must start on minimal servers and containers)
        run: |
          ldd target/debug/slurp
          ! ldd target/debug/slurp | grep -i dbus
      - run: npm run typecheck
        working-directory: backend
      - name: Worker tests (wrangler dev, local R2 and Durable Objects, real CLI)
        run: npm test
        working-directory: backend
        timeout-minutes: 10
        env:
          WRANGLER_SEND_METRICS: "false"
          # Here the real Python SDK test must run, not skip.
          SLURP_COMPAT_REQUIRED: "1"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: SDK tests against the Worker
        run: node --test --test-force-exit --test-timeout=150000 test/*.test.ts
        working-directory: sdks/js
        timeout-minutes: 6
      - name: React Native package (needs the built core)
        run: |
          pnpm --filter @hitslop/slurp-sdk build
          pnpm --filter @hitslop/slurp-react-native typecheck
          pnpm --filter @hitslop/slurp-react-native build
          pnpm --filter @hitslop/slurp-react-native test

  swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift SDK through the repository's root manifest (what people add by URL)
        run: swift test
      - name: Swift SDK on its own
        run: swift test
        working-directory: sdks/swift

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install chart bundle verifier
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Embedded chart assets match their source
        run: pnpm --dir report-assets check
      - name: Chart text measurement tests
        run: pnpm --dir report-assets test
      - run: pnpm --filter slurp-setup check
      - run: pnpm --filter slurp-setup build
      - name: The CLI's embedded quickstart page is current
        run: git diff --exit-code -- crates/slurp-cli/assets/setup.html
      - run: pnpm --filter slurp-site check
      - run: pnpm --filter slurp-site build
      - run: pnpm --filter @hitslop/slurp-sdk typecheck
      - name: The README pricing table matches the site
        run: node apps/site/scripts/readme-pricing.mjs --check
      - name: The README badges match the site
        run: node apps/site/scripts/readme-badges.mjs --check
      - name: CI policy scripts
        run: node --test scripts/ci/attribution.test.mjs
