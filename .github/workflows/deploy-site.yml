name: Deploy site

# Builds apps/site and deploys it to the slurp-site Cloudflare Worker (static assets) on slurp.run.
# Nothing deploys until the repository variable SLURP_DEPLOY_ENABLED is "true", so forks and a fresh clone never try.
on:
  push:
    branches: [master]
    paths:
      - apps/site/**
      - packages/web-shared/**
      - examples/**
      - docs/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slurp-site
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SLURP_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter slurp-site check
      - run: pnpm --filter slurp-site build
      - run: pnpm --filter slurp-site deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
