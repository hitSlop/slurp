*{box-sizing:border-box}
body{margin:0;background:#ffffff;color:#161616;font-family:'Geist Mono',monospace;font-size:12px}
main{width:840px;max-width:100%;display:flex;flex-direction:column;gap:1px;background:#dadada;border:1px solid #dadada}
.bar{width:100%;display:flex;flex-direction:row;align-items:center;gap:14px;padding:7px 14px;background:#e8002a;color:#ffffff;font-size:10.5px}
.brand{display:flex;flex-direction:row;align-items:center;gap:8px}
.brand img{width:20px;height:20px;border-radius:10px;background:#ffffff}
.brand b{font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.purpose{flex:1;color:#ffffffe6;font-size:11px}
.date{font-weight:600;letter-spacing:.04em}
.text{width:100%;padding:22px 24px 20px;background:#ffffff}
.text h1{margin:0 0 10px;font-size:22px;line-height:1.2;letter-spacing:-.02em}
.text p{margin:0;line-height:1.75}
section{width:100%;display:flex;flex-direction:column;background:#ffffff}
.row{width:100%;display:flex;flex-direction:row;gap:1px;background:#dadada}.row section{flex:1;width:auto}
header{display:flex;flex-direction:row;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #eaedef}
h2{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.n{display:none}.q{color:#ababab;font-size:10px}
.body{padding:12px 14px 14px}
.label{margin:0 0 6px;color:#ababab;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.value{display:block;font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.03em;color:#2670a9}
table{width:100%;border-collapse:collapse}
td,th{min-width:6ch;overflow-wrap:anywhere}
th{padding:5px 8px;text-align:left;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#ababab;border-bottom:1px solid #c5c9d0}
td{padding:5px 8px;border-bottom:1px solid #eaedef}
th.num,td.num{text-align:right;white-space:nowrap}
.more,.empty{margin:0;padding:8px 8px 0;color:#ababab;font-size:10px}
.empty{padding:18px 8px;font-size:11px}
.text p,.text li{overflow-wrap:anywhere}
.value{overflow-wrap:anywhere}
pre{margin:12px 0;padding:10px 12px;background:#eaedef;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;line-height:1.55}
.text h2{margin:20px 0 8px;font-size:15px;font-weight:700;letter-spacing:-.01em;text-transform:none}
.text h3{margin:16px 0 6px;font-size:13px;font-weight:700}
.text h4{margin:12px 0 4px;font-size:12px;font-weight:700}
.text p+p{margin-top:8px}
.text ul,.text ol{margin:8px 0;padding-left:22px}
.text li{margin:3px 0;line-height:1.6}
.text blockquote{margin:12px 0;padding:6px 0 6px 14px;border-left:3px solid #2670a9}
.text blockquote p{margin:0}
.text hr{height:1px;border:0;background:#dadada;margin:16px 0}
.text code{padding:1px 4px;background:#eaedef}
.text pre code{padding:0;background:transparent}
.text a{color:#2670a9;text-decoration:underline}
