[package]
name = "native-rendering-spike"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
slurp-render = { path = "../../crates/slurp-render" }
takumi = { version = "=2.19.0", features = ["from-html", "unstable"] }
takumi-pdf = "=0.19.0"
resvg = { version = "=0.49.0", default-features = false, features = ["text"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
[profile.release]
debug = false
